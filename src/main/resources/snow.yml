snow:
  enabled: true
  apply-to-all-players: true
  keep-snow-on-disable: true
  radius: 24
  density: 40
  duration: 0
  no-snow-near-player-radius: 1.5
  no-snow-near-entity-radius: 1.25

  presnow:
    bias-front: true
    lookahead-factor: 0.66

  respect-roof: true
  blocked-wg-regions:
    - santa_zone

snowify:
  # ONLY used for banned-blocks in the code
  banned-blocks:
    - OAK_SLAB
    - SPRUCE_SLAB
    - COBBLESTONE_SLAB
    - STONE_BRICK_SLAB
    - STONE_BRICK_STAIRS
    - COBBLESTONE_STAIRS
    - OAK_FENCE
    - OAK_FENCE_GATE
    - FLOWERING_AZALEA_LEAVES
