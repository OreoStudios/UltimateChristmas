  krampus:
    # Optional recurring encounters (off by default for backwards compatibility).
    # Populate locations or keep the legacy single 'spawn:' section below.
    auto-spawn:
      enabled: false
      interval-minutes: 60
      respawn-after-death-minutes: 30
      max-alive: 1
      announce: true
      locations: []
      #  - { world: world, x: 100, y: 65, z: -50 }
      #  - "world,200,65,100"
    display-name: "&4&lKrampus"
    entity-type: PIGLIN_BRUTE
    health: 1200
    speed: 0.32
