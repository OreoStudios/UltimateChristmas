# ============================================================================
#  modules/economy.yml - the festive shard currency
#  Reload with: /christmas module reload economy
# ============================================================================

earning:
  # Blocks a player placed themselves pay nothing. Leave this on: without it,
  # a player can place an ore block and break it over and over for free shards.
  ignore-player-placed: true

  # Show a short action-bar note when shards are earned.
  announce: true
  announce-threshold: 1

  # Vanilla blocks. 'shards' is a fixed number or an inclusive range ("3-7").
  # 'chance' is 0.0-1.0, or a percentage if you write a number above 1.
  blocks:
    iron_ore:
      shards: 4-7
      chance: 0.25
    deepslate_iron_ore:
      shards: 5-8
      chance: 0.25
    coal_ore:
      shards: 1-3
      chance: 0.35
    deepslate_coal_ore:
      shards: 2-4
      chance: 0.35
    diamond_ore:
      shards: 20-35
      chance: 0.80
    deepslate_diamond_ore:
      shards: 25-40
      chance: 0.80
    emerald_ore:
      shards: 15-25
      chance: 0.60
    gold_ore:
      shards: 6-10
      chance: 0.30
    ancient_debris:
      shards: 40-60
      chance: 1.0
    spruce_log:
      shards: 1
      chance: 0.20
    oak_log:
      shards: 1
      chance: 0.15
    snow_block:
      shards: 1
      chance: 0.05
    packed_ice:
      shards: 2
      chance: 0.15
    blue_ice:
      shards: 4
      chance: 0.20

  # Vanilla mobs, by Bukkit entity type.
  mobs:
    zombie:
      shards: 3-6
      chance: 0.30
    skeleton:
      shards: 3-6
      chance: 0.30
    stray:
      shards: 8-14
      chance: 0.60
    spider:
      shards: 2-4
      chance: 0.25
    creeper:
      shards: 10-18
      chance: 0.35
    enderman:
      shards: 12-20
      chance: 0.40
    snow_golem:
      shards: 1-2
      chance: 0.10
    polar_bear:
      shards: 10-15
      chance: 0.50
    witch:
      shards: 15-25
      chance: 0.60
    wither:
      shards: 150-250
      chance: 1.0
    ender_dragon:
      shards: 400-600
      chance: 1.0

  # ItemsAdder custom blocks, keyed by namespace:id. Needs ItemsAdder; these
  # are examples and are simply ignored if the ids do not exist.
  itemsadder-blocks:
    christmas:present_block:
      shards: 20-30
      chance: 1.0

  # MythicMobs mobs, by internal name (not display name). Needs MythicMobs.
  mythicmobs:
    FrostGiant:
      shards: 60-90
      chance: 1.0
    EvilElf:
      shards: 20-35
      chance: 0.75

# Sending shards to another player with /christmas pay.
pay:
  enabled: true
  minimum: 1
  # Naughty/nice credit for being generous. Rate-limited to once an hour so it
  # cannot be farmed by two accounts passing shards back and forth.
  nice-points: 1
