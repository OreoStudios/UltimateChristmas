# ============================================================================
#  modules/pass.yml - the festive pass
#  Reload with: /christmas module reload pass
# ----------------------------------------------------------------------------
#  Players earn pass experience all season and claim tier rewards. Each tier
#  can carry a 'free' reward for everyone and a 'premium' reward for holders of
#  the premium pass (granted by permission or /christmas pass premium <player>).
# ============================================================================

xp:
  # Experience from specific events.
  per-advent-door: 100
  per-quest: 50

  # Experience per unit of a tracked stat (may be fractional).
  per-stat:
    shards_earned: 0.05
    presents_found: 25
    snowballs_hit: 2
    bosses_slain: 250
    ornaments_hung: 15
    gifts_given: 10

premium-permission: ultimatechristmas.pass.premium

# ----------------------------------------------------------------------------
#  Tiers. 'xp' is the TOTAL experience needed to reach the tier.
# ----------------------------------------------------------------------------
tiers:
  "1":
    xp: 100
    free:
      shards: 100
    premium:
      shards: 200
      items:
        - { material: COOKIE, amount: 8 }
  "2":
    xp: 300
    free:
      shards: 150
    premium:
      items:
        - { material: GOLDEN_APPLE, amount: 2 }
  "3":
    xp: 600
    free:
      shards: 250
      pass-xp: 0
    premium:
      shards: 300
      items:
        - { material: DIAMOND, amount: 2 }
  "4":
    xp: 1000
    free:
      items:
        - { material: IRON_BLOCK, amount: 1 }
    premium:
      shards: 500
      firework: true
  "5":
    xp: 1500
    free:
      shards: 500
    premium:
      items:
        - { material: NETHERITE_SCRAP, amount: 1 }
  "6":
    xp: 2200
    free:
      shards: 600
    premium:
      items:
        - { material: ENCHANTED_GOLDEN_APPLE, amount: 1 }
  "7":
    xp: 3000
    free:
      shards: 750
    premium:
      shards: 1000
  "8":
    xp: 4000
    free:
      items:
        - { material: DIAMOND_BLOCK, amount: 1 }
    premium:
      items:
        - { material: NETHERITE_INGOT, amount: 1 }
  "9":
    xp: 5500
    free:
      shards: 1200
    premium:
      shards: 1500
      firework: true
  "10":
    xp: 7500
    free:
      shards: 2000
      items:
        - { material: DIAMOND, amount: 8 }
    premium:
      shards: 3000
      items:
        - { material: NETHERITE_INGOT, amount: 2 }
        - { material: ELYTRA, amount: 1 }
      broadcast: ["&6%player% &ereached the final festive pass tier!"]
      firework: true
