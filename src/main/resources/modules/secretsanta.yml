# ============================================================================
#  modules/secretsanta.yml - the Secret Santa exchange
#  Reload with: /christmas module reload secretsanta
# ----------------------------------------------------------------------------
#  Players join with /christmas secretsanta join. An admin draws pairings with
#  /christmas secretsanta draw. Players deliver a held item with
#  /christmas secretsanta deliver - it reaches their recipient (held for them
#  if they are offline).
#
#  Participants and pairings are saved under 'state' / 'pending' - leave those
#  to the plugin.
# ============================================================================

# Naughty/nice credit for delivering your gift.
nice-points: 5

# Announce (without naming the giver) when a gift is delivered.
announce-delivery: false
