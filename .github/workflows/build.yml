name: Build and test UltimateChristmas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultimatechristmas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 / Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python for boss model compilation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install configuration validator dependency
        run: python -m pip install -r .github/requirements-ci.txt

      - name: Validate bundled YAML configurations
        run: python tools/check_configs.py

      - name: Verify bundled NoteBlock music
        run: python tools/verify_music.py

      - name: Compile and run Maven tests
        run: mvn -B --no-transfer-progress clean verify -Dpython.executable=python3

      - name: Verify plugin jar exists
        shell: bash
        run: |
          shopt -s nullglob
          jars=(target/UltimateChristmas-*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one shaded plugin JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          ls -lh "${jars[0]}"
          sha256sum "${jars[0]}"

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: UltimateChristmas-Java21
          path: target/UltimateChristmas-*.jar
          if-no-files-found: error
          retention-days: 14
